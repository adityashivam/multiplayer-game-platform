      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#2a1d2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a8"/>
      <stop offset="0.35" stop-color="#ff7a2e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff3d1e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="windows" width="16" height="18" patternUnits="userSpaceOnUse">
      <rect width="16" height="18" fill="#1b1d25"/>
      <rect x="4" y="5" width="8" height="8" fill="#0d0f15"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="520" cy="70" r="26" fill="#d7defa" opacity="0.85"/>
  <g fill="#151824">
