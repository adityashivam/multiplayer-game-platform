    <rect x="36" y="224" width="218" height="8" fill="#5e5d5c"/>
    <rect x="330" y="205" width="250" height="155" fill="url(#windows)"/>
    <rect x="326" y="199" width="258" height="8" fill="#5e5d5c"/>
    <rect x="70" y="262" width="8" height="8" fill="#ffd59a"/><rect x="118" y="298" width="8" height="8" fill="#ffd59a"/>
    <rect x="182" y="262" width="8" height="8" fill="#bfe3ff"/><rect x="390" y="226" width="8" height="8" fill="#ffd59a"/>
    <rect x="470" y="262" width="8" height="8" fill="#ffd59a"/><rect x="534" y="298" width="8" height="8" fill="#bfe3ff"/>
